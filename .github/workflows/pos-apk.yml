# Compila la app del POS (pos-app/) y deja el APK para descargar desde GitHub (Actions → la ejecución → Artifacts).
# No hace falta instalar Flutter en la PC: corre al hacer push con cambios en pos-app/ o a mano con «Run workflow».
name: APK del POS

on:
  push:
    paths: ['pos-app/**', '.github/workflows/pos-apk.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: URL del Sistema de Faltas que abre la app
        default: https://piloto-faltas-post.vercel.app
      publicar:
        description: Publicar como actualización para los POS (si/no)
        default: 'si'

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: pos-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Generar la carpeta android/ (si no está en el repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ar.gob.malvinasargentinas --project-name faltas_pos .
          fi

      - name: Permisos (internet, cámara, GPS, Bluetooth), impresora y nombre visible
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in INTERNET CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION REQUEST_INSTALL_PACKAGES BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
          sed -i 's#android:label="[^"]*"#android:label="Faltas Post"#' $M
          # Impresora: ver si está el servicio de Senraise (Android 11+ exige declararlo) y canal propio (MainActivity)
          grep -q 'recieptservice.com.recieptservice' $M || sed -i 's#<application#<queries><package android:name="recieptservice.com.recieptservice" /><package android:name="woyou.aidlservice.jiuiv5" /><package android:name="net.nyx.printerservice" /><package android:name="com.incar.printerservice" /></queries>\n    <application#' $M
          cp android-extra/MainActivity.kt android/app/src/main/kotlin/ar/gob/malvinasargentinas/faltas_pos/MainActivity.kt
          # ota_update: provider para instalar versiones nuevas
          grep -q OtaUpdateFileProvider $M || python3 -c "import sys;m=sys.argv[1];x=open(m).read();open(m,'w').write(x.replace('</application>', open('android-extra/provider.xml').read()+'    </application>',1))" $M
          mkdir -p android/app/src/main/res/xml && cp android-extra/filepaths.xml android/app/src/main/res/xml/filepaths.xml
          grep -q 'faltas-pos:' android/build.gradle.kts || { cat android-extra/root-prepend.gradle.kts android/build.gradle.kts > /tmp/r.kts && mv /tmp/r.kts android/build.gradle.kts; }
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          # «Faltas Post»: paquete propio para convivir con «Faltas» (referencia 1.0)
          sed -i 's/applicationId = "[^"]*"/applicationId = "ar.gob.malvinasargentinas.faltas_post"/' android/app/build.gradle.kts
          cat $M

      - name: Compilar APK
        run: |
          # Firma fija: el APK release se firma con la clave debug del runner, que cambia en cada ejecución.
          # Con una clave distinta Android no deja actualizar la app instalada («Cancelando...»). Usamos siempre la del repo.
          mkdir -p $HOME/.android && cp firma/debug.keystore $HOME/.android/debug.keystore
          flutter pub get
          # AGP nuevos rechazan getDefaultProguardFile('proguard-android.txt') usado por flutter_inappwebview_android
          find $HOME/.pub-cache/hosted -path '*flutter_inappwebview*' -name build.gradle -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +
          BUILD=$(( ($(date -u +%s) - 1767225600) / 60 ))   # minutos desde 2026-01-01 UTC (igual que compilar-apk.bat)
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          flutter build apk --release --build-number=$BUILD --dart-define=APP_URL=${{ github.event.inputs.app_url || 'https://piloto-faltas-post.vercel.app' }} --dart-define=VERSION_URL=https://uahubgleoemcvuzuumyv.supabase.co/storage/v1/object/public/pos-app/version.json

      - name: Publicar como actualización (Supabase Storage)
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && github.event.inputs.publicar != 'no' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: .
        run: node pos-app/publicar.mjs pos-app/build/app/outputs/flutter-apk/app-release.apk $BUILD

      - uses: actions/upload-artifact@v4
        with:
          name: faltas-pos-apk
          path: pos-app/build/app/outputs/flutter-apk/app-release.apk
