# Compila la app del POS (pos-app/) y deja el APK para descargar desde GitHub (Actions → la ejecución → Artifacts).
# No hace falta instalar Flutter en la PC: corre al hacer push con cambios en pos-app/ o a mano con «Run workflow».
name: APK del POS

on:
  push:
    paths: ['pos-app/**', '.github/workflows/pos-apk.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: URL del Sistema de Faltas que abre la app
        default: https://piloto-faltas.vercel.app

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la carpeta android/ (si no está en el repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ar.gob.malvinasargentinas --project-name faltas_pos .
          fi

      - name: Permisos (internet, cámara, GPS) y nombre visible
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in INTERNET CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            grep -q "android.permission.$p\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
          sed -i 's#android:label="[^"]*"#android:label="Faltas"#' $M
          cat $M

      - name: Compilar APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=APP_URL=${{ github.event.inputs.app_url || 'https://piloto-faltas.vercel.app' }}

      - uses: actions/upload-artifact@v4
        with:
          name: faltas-pos-apk
          path: pos-app/build/app/outputs/flutter-apk/app-release.apk
