name: faltas_pos
description: App del inspector para los POS (Senraise H10S, Symcode MJ-Q50). Abre el Sistema de Faltas e imprime el ticket con la impresora térmica.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  senraise_printer: ^0.0.6
  image_picker: ^1.1.2
  ota_update: ">=6.0.0 <7.0.0"
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_ticket.png
